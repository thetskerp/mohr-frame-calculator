name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, Clippy and tests
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64

      - name: Build Qt application
        run: |
          cmake -S . -B build/qt -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build/qt --parallel 4

      - name: Smoke test Qt application
        run: QT_QPA_PLATFORM=offscreen "build/qt/Mohr Frame.app/Contents/MacOS/Mohr Frame" --smoke-test

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run tests
        run: cargo test --locked

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64

      - name: Build Qt application
        shell: pwsh
        run: |
          cmake -S . -B build/qt -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DRUST_PROFILE=release
          cmake --build build/qt --config Release --parallel 4

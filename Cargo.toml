[package]
name = "mohr-frame"
version = "0.5.0"
edition = "2021"
description = "Графический расчет перемещений плоской стержневой рамы методом Мора"
license = "MIT"
repository = "https://github.com/thetskerp/mohr-frame-calculator"
readme = "README.md"
keywords = ["structural-mechanics", "mohr", "frame", "engineering"]
categories = ["science", "visualization"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "system_fonts", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[lib]
name = "mohr_frame"
path = "src/lib.rs"

[[bin]]
name = "mohr-frame"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"


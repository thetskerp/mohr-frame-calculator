[package]
name = "mohr-frame"
version = "0.9.0"
edition = "2021"
description = "Графический расчет перемещений плоской стержневой рамы методом Мора"
license = "MIT"
repository = "https://github.com/thetskerp/mohr-frame-calculator"
readme = "README.md"
keywords = ["structural-mechanics", "mohr", "frame", "engineering"]
categories = ["science", "visualization"]

[features]
default = ["legacy-egui"]
legacy-egui = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "persistence", "system_fonts", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = { version = "0.15", optional = true }
calamine = "0.38.0"
csv = "1.4.0"
cxx = "1.0.205"

[lib]
name = "mohr_frame"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "mohr-frame"
path = "src/main.rs"
required-features = ["legacy-egui"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[build-dependencies]
cxx-build = "1.0.205"

